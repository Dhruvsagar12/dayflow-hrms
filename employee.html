<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - Dayflow HRMS</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <div class="container">
        <h1><ion-icon name="person-outline"></ion-icon> Employee Profile</h1>
        
        <!-- Profile Picture -->
        <div class="card profile-pic-section">
            <img id="profilePic" src="https://via.placeholder.com/150?text=DP" alt="Profile Picture" class="profile-img">
            <input type="file" id="picUpload" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('picUpload').click()">Change Photo</button>
        </div>

        <!-- Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showTab('personal')">Personal Details</button>
            <button class="tab-btn" onclick="showTab('job')">Job Details</button>
            <button class="tab-btn" onclick="showTab('salary')">Salary Structure</button>
            <button class="tab-btn" onclick="showTab('docs')">Documents</button>
        </div>

        <!-- Personal Details -->
        <div id="personal" class="tab-content active">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="empName" value="Dhruv Sagar" readonly>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Phone <span class="edit-icon" onclick="toggleEdit('phone')">✏️</span></label>
                    <input type="tel" id="phone" value="+91 9876543210">
                </div>
                <div class="form-group">
                    <label>Address <span class="edit-icon" onclick="toggleEdit('address')">✏️</span></label>
                    <textarea id="address">Anand, Gujarat, India</textarea>
                </div>
            </div>
            <button onclick="saveChanges('personal')" class="save-btn">Save Changes</button>
        </div>

        <!-- Job Details -->
        <div id="job" class="tab-content">
            <div class="form-row">
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" value="EMP001" readonly>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" value="Computer Engineering" readonly>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Joining Date</label>
                    <input type="date" value="2025-08-01" readonly>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" value="Hackathon Developer" readonly>
                </div>
            </div>
        </div>

        <!-- Salary Structure -->
        <div id="salary" class="tab-content">
            <div class="salary-table">
                <div class="salary-row">
                    <span>Basic Salary</span>
                    <span>₹25,000</span>
                </div>
                <div class="salary-row">
                    <span>HRA</span>
                    <span>₹7,500</span>
                </div>
                <div class="salary-row">
                    <span>Special Allowance</span>
                    <span>₹5,000</span>
                </div>
                <div class="salary-row total">
                    <span>Gross Salary</span>
                    <span>₹37,500</span>
                </div>
            </div>
        </div>

        <!-- Documents -->
        <div id="docs" class="tab-content">
            <div class="doc-item">
                <ion-icon name="document-outline"></ion-icon>
                <span>Aadhar Card.pdf</span>
                <button>Download</button>
            </div>
            <div class="doc-item">
                <ion-icon name="document-outline"></ion-icon>
                <span>Pan Card.pdf</span>
                <button>Download</button>
            </div>
            <div class="upload-section">
                <input type="file" id="docUpload" multiple>
                <button onclick="document.getElementById('docUpload').click()">Upload Document</button>
            </div>
        </div>
    </div>

    <script src="employee.js"></script>
</body>
</html>
