<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dayflow HRMS</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <div class="container">
        <h1><ion-icon name="shield-checkmark-outline"></ion-icon> Admin Panel</h1>
        
        <!-- Employee Selector -->
        <div class="card employee-selector">
            <label>Manage Employee:</label>
            <select id="employeeSelect" onchange="loadEmployee()">
                <option value="">Select Employee</option>
                <option value="emp1">Dhruv Sagar (EMP001)</option>
                <option value="emp2">Rahul Patel (EMP002)</option>
                <option value="emp3">Priya Sharma (EMP003)</option>
            </select>
        </div>

        <!-- Profile Picture (Admin Editable) -->
        <div class="card profile-pic-section">
            <img id="adminProfilePic" src="https://via.placeholder.com/150?text=DP" alt="Profile Picture" class="profile-img">
            <input type="file" id="adminPicUpload" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('adminPicUpload').click()">Update Photo</button>
        </div>

        <!-- Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showTab('admin-personal')">Personal Details</button>
            <button class="tab-btn" onclick="showTab('admin-job')">Job Details</button>
            <button class="tab-btn" onclick="showTab('admin-salary')">Salary Structure</button>
            <button class="tab-btn" onclick="showTab('admin-docs')">Documents</button>
        </div>

        <!-- Personal Details (FULL EDIT) -->
        <div id="admin-personal" class="tab-content active">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="adminEmpName" value="Dhruv Sagar">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="adminPhone" value="+91 9876543210">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" value="dhruv@example.com">
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="adminAddress">Anand, Gujarat, India</textarea>
            </div>
            <button onclick="saveAdminChanges('personal')" class="save-btn">💾 Save All Changes</button>
        </div>

        <!-- Job Details (FULL EDIT) -->
        <div id="admin-job" class="tab-content">
            <div class="form-row">
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" id="adminEmpId" value="EMP001">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select id="adminDept">
                        <option>Computer Engineering</option>
                        <option>Mechanical Engineering</option>
                        <option>HR</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Joining Date</label>
                    <input type="date" id="adminJoinDate" value="2025-08-01">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="adminRole" value="Hackathon Developer">
                </div>
            </div>
            <button onclick="saveAdminChanges('job')" class="save-btn">💾 Update Job Details</button>
        </div>

        <!-- Salary Structure (FULL EDIT) -->
        <div id="admin-salary" class="tab-content">
            <div class="form-row">
                <div class="form-group">
                    <label>Basic Salary</label>
                    <input type="number" id="adminBasic" value="25000">
                </div>
                <div class="form-group">
                    <label>HRA (24%)</label>
                    <input type="number" id="adminHRA" value="7500">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Allowance</label>
                    <input type="number" id="adminAllowance" value="5000">
                </div>
                <div class="form-group">
                    <label>Total Salary</label>
                    <input type="number" id="adminTotal" value="37500" readonly>
                </div>
            </div>
            <button onclick="calculateSalary()" class="save-btn">Calculate Total</button>
            <button onclick="saveAdminChanges('salary')" class="save-btn">💾 Save Salary</button>
        </div>

        <!-- Documents (Admin Full Control) -->
        <div id="admin-docs" class="tab-content">
            <div class="docs-grid">
                <div class="doc-item">
                    <ion-icon name="document-outline"></ion-icon>
                    <span>Aadhar Card.pdf</span>
                    <button onclick="downloadDoc('aadhar')">📥 Download</button>
                    <button class="delete-btn">🗑️ Delete</button>
                </div>
                <div class="doc-item">
                    <ion-icon name="document-outline"></ion-icon>
                    <span>Pan Card.pdf</span>
                    <button onclick="downloadDoc('pan')">📥 Download</button>
                    <button class="delete-btn">🗑️ Delete</button>
                </div>
            </div>
            <div class="upload-section">
                <input type="file" id="adminDocUpload" multiple>
                <button onclick="document.getElementById('adminDocUpload').click()">📤 Upload Document</button>
            </div>
            <button onclick="saveAdminChanges('docs')" class="save-btn">💾 Save Document Changes</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
